name: GRANDZERO Stage B External Replay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-stage-b-lean4331-replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record independent runner OS & verify frozen Stage B ZIP SHA-256 directly in shell
        run: |
          set -euo pipefail
          cat /etc/os-release
          uname -a
          echo "ca8d9bd2383648c625eac044aefaade01b53c442fc8238fec7f306bbf72609db  GRANDZERO_STAGE_B_2CELL_Q0_CLEANROOM_SOURCE_ARCHIVE.zip" | sha256sum -c -

      - name: Install elan & exact Lean 4.33.1 toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Run Hardened Stage B Replay Verifier
        run: |
          set -euo pipefail
          python3 verify_stage_b_external_replay.py

      - name: Print Receipt to Raw GitHub Actions Step Log
        if: always()
        run: |
          if [ -f STAGE_B_EXTERNAL_REPLAY_RECEIPT.md ]; then
            cat STAGE_B_EXTERNAL_REPLAY_RECEIPT.md
          fi

      - name: Upload Stage B External Replay Receipt Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-external-replay-receipt-run-${{ github.run_id }}
          path: STAGE_B_EXTERNAL_REPLAY_RECEIPT.md
          if-no-files-found: error
